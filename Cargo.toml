[package]
name = "notes-api"
version = "0.1.0"
edition = "2024"
# Not decoration: the battery runs `cargo deny check`, whose `licenses` stage
# refuses a crate that declares none — which is what `cargo new` leaves.
license = "Apache-2.0"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1"] }
chrono = { version = "0.4", default-features = false, features = ["now", "serde"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
serde_json = "1"
tower = { version = "0.5", default-features = false, features = ["util"] }
